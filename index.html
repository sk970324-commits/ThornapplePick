<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1113">
<meta name="description" content="가장 깊은 어둠 속에서도 끝까지 피어날 노래">
<meta property="og:title" content="쏜애플 최애곡 PICK">
<meta property="og:description" content="가장 깊은 어둠 속에서도 끝까지 피어날 노래">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8D%8E%3C/text%3E%3C/svg%3E">
<title>쏜애플 최애곡 PICK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1113; --bg2:#05090a; --ink:#e3ebea; --mute:#7f9496; --line:#1f3034;
  --card:#111c1f; --accent:#b23a47; --frost:#eef3f2;
  color-scheme: dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1113; --bg2:#05090a; --ink:#e3ebea; --mute:#7f9496; --line:#1f3034;
    --card:#111c1f; --accent:#b23a47; --frost:#eef3f2; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1113; --bg2:#05090a; --ink:#e3ebea; --mute:#7f9496; --line:#1f3034;
  --card:#111c1f; --accent:#b23a47; --frost:#eef3f2; color-scheme:dark;
}
.art{display:block;width:100%;aspect-ratio:2/1;background:var(--bg2);border:1px solid var(--line);margin:0 0 18px;overflow:hidden}
.art svg{display:block;width:100%;height:100%}
.pick.won .art{border-color:var(--bg)}
.crown .art{max-width:420px;background:#05090a;border-color:#1f3034;margin-bottom:22px}
.alb{font-size:13px;color:var(--mute);margin:0 0 12px;font-weight:400}
.badge{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:4px 12px 4px 10px;font-size:12px;line-height:1.4;color:var(--ink);
  background:color-mix(in srgb,var(--c) 20%,transparent);border:1px solid color-mix(in srgb,var(--c) 65%,transparent);
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.badge i{flex:none;width:7px;height:7px;background:var(--c);transform:rotate(45deg)}
.badge svg{flex:none;width:15px;height:15px;display:block}
.badge b{font-weight:500;white-space:normal;word-break:keep-all}
.badge small{font-size:11px;opacity:.65;font-weight:300}
.pick.won .badge,.crown .badge{color:#0a1113;background:color-mix(in srgb,var(--c) 30%,transparent)}
.pick.won .alb{color:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-weight:300; line-height:1.6;
  background-image:
    linear-gradient(135deg, transparent 0 48%, var(--bg2) 48% 52%, transparent 52%),
    radial-gradient(120% 80% at 50% 0%, transparent 40%, var(--bg2) 100%);
  background-size: 120px 120px, 100% 100%;
  background-attachment: fixed;
}
.serif{font-family:"Nanum Myeongjo","AppleMyungjo","Batang",serif}
.bgart{position:fixed;right:-8vmin;bottom:-6vmin;width:78vmin;height:82vmin;opacity:.11;pointer-events:none;z-index:0}
.bgart svg{width:100%;height:100%;display:block}
.wrap{position:relative;z-index:1}
body.on-intro .bgart{opacity:0}
.bgart{transition:opacity .6s}
.intro{position:relative;min-height:min(72vh,680px);display:grid;place-items:center;text-align:center;padding:56px 0 40px;overflow:hidden}
.intro .pod{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;opacity:.28;pointer-events:none;animation:podIn 1.4s ease-out both}
.intro .pod svg{height:100%;width:auto;max-width:100%}
@keyframes podIn{from{opacity:0;transform:scale(.94) rotate(-4deg)}to{opacity:.28;transform:none}}
.intro-in{position:relative;max-width:30em;padding:0 8px}
.intro .kick{font-size:13px;letter-spacing:.2em;color:var(--accent);margin:0 0 18px;font-weight:500}
.intro h2{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:clamp(40px,8vw,76px);line-height:1.1;margin:0 0 20px;letter-spacing:-0.02em;text-shadow:0 2px 24px #0a1113}
.intro .sub{color:var(--mute);margin:0 0 36px;word-break:keep-all}
.intro .saved{font-size:13px;color:var(--accent);margin:-22px 0 30px;letter-spacing:.04em}
.startBtn{background:var(--frost);color:#0a1113;border:0;padding:16px 48px;font-size:17px;font-weight:500;letter-spacing:.12em;
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);transition:background .2s,color .2s}
.startBtn:hover{background:var(--accent);color:var(--frost)}
@media (max-width:720px){.bgart{width:110vw;height:115vw;right:-30vw;bottom:-10vw;opacity:.08}}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 64px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:16px}
h1{margin:0;font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:clamp(28px,5vw,46px);letter-spacing:-0.02em;line-height:1.1}
h1 small{display:block;font-family:"IBM Plex Sans KR",sans-serif;font-weight:300;font-size:14px;letter-spacing:0;color:var(--mute);margin-top:8px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer}
.ghost{background:transparent;border:1px solid var(--line);padding:8px 14px;font-size:14px;font-weight:400;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.ghost:hover{border-color:var(--ink)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* start */
.start{padding:56px 0 24px;text-align:center}
.start p{color:var(--mute);max-width:34em;margin:0 auto 32px}
.sizes{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.size{background:var(--card);border:1px solid var(--line);padding:22px 34px;min-width:150px;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);transition:background .2s,color .2s}
.size b{display:block;font-family:"Nanum Myeongjo",serif;font-size:30px;font-weight:800}
.size span{font-size:13px;color:var(--mute)}
.size:hover{background:var(--ink);color:var(--bg)}
.size:hover span{color:var(--bg)}
.size[disabled]{opacity:.35;pointer-events:none}

/* match */
.status{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 14px;font-size:14px;color:var(--mute)}
.status strong{font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:22px;color:var(--ink);font-weight:500;margin-right:10px;letter-spacing:-0.02em}
.bar{height:2px;background:var(--line);margin-bottom:26px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);transition:width .4s}
.arena{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:0}
.pick{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);padding:38px 34px 34px;min-height:340px;
  display:flex;flex-direction:column;transition:transform .25s, opacity .35s, background .25s}
.pick.l{clip-path:polygon(0 0,100% 0,calc(100% - 40px) 100%,0 100%);padding-right:70px}
.pick.r{clip-path:polygon(40px 0,100% 0,100% 100%,0 100%);padding-left:70px;margin-left:-40px}
.pick:hover{background:var(--bg2)}
.pick .t{font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:500;font-size:clamp(24px,3.2vw,34px);line-height:1.2;margin:0 0 18px;letter-spacing:-0.02em}
.pick .d{font-size:14px;color:var(--mute);margin:0;max-width:30em}
.pick .q{margin:0 0 20px;padding:12px 4px 12px 18px;font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400;font-size:clamp(15px,1.6vw,17px);line-height:1.7;color:var(--frost);border-left:3px solid var(--accent);background:linear-gradient(90deg,rgba(178,58,71,.16),transparent 75%);word-break:keep-all}
.pick .q:empty{display:none}
.q .ln{display:block}
.q .ln+.ln{margin-top:.5em}
.pick .d .ln,.crown p .ln{display:block}
.pick .d .ln+.ln,.crown p .ln+.ln{margin-top:.45em}
.pick .go{margin-top:auto;padding-top:20px;font-size:15px;color:var(--accent);font-weight:500;letter-spacing:.14em}
.pick.won{background:var(--ink);color:var(--bg)}
.pick.won .d,.pick.won .q{color:var(--bg)}
.pick.lost{opacity:.12;transform:scale(.97)}
.thorn{position:absolute;left:50%;top:50%;width:92px;height:92px;transform:translate(-50%,-50%);pointer-events:none;z-index:2}
.thorn svg{width:100%;height:100%;display:block}
.thorn text{font-family:"Nanum Myeongjo",serif;font-weight:800}
.under{display:flex;justify-content:space-between;margin-top:18px}

/* result */
.result{padding:40px 0 10px}
.crown{position:relative;background:var(--ink);color:var(--bg);padding:52px 40px 44px;
  clip-path:polygon(0 0,calc(100% - 60px) 0,100% 60px,100% 100%,60px 100%,0 calc(100% - 60px))}
.crown .lab{font-size:14px;opacity:.7}
.crown h2{font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:500;font-size:clamp(36px,7vw,68px);margin:8px 0 18px;line-height:1.1;letter-spacing:-0.03em}
.crown p{max-width:34em;margin:0;opacity:.85}
.crown .q{font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400;font-size:clamp(16px,2vw,19px);line-height:1.7;margin-top:22px;padding-left:18px;border-left:3px solid var(--accent);word-break:keep-all}
.crown .q:empty{display:none}
.ranks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:22px}
.rk{border:1px solid var(--line);padding:16px 18px;background:var(--card)}
.rk span{font-size:13px;color:var(--mute)}
.rk b{display:block;font-family:"IBM Plex Sans KR",system-ui,sans-serif;font-size:19px;font-weight:500;margin-top:2px}
.path{margin-top:26px;color:var(--mute);font-size:14px}
.path ol{padding-left:20px;margin:8px 0 0}
.outro{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:clamp(24px,4vw,36px);line-height:1.3;margin:44px 0 0;padding-top:28px;border-top:1px solid var(--line);color:var(--frost);word-break:keep-all}
.outro::before{content:"";display:inline-block;width:.42em;height:.42em;background:var(--accent);transform:rotate(45deg);margin-right:.5em;vertical-align:.12em}

/* editor */
dialog{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0;max-width:720px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(5,10,12,.7)}
.ed{padding:26px}
.ed h3{font-family:"Nanum Myeongjo",serif;font-size:24px;margin:0 0 6px}
.ed p{font-size:14px;color:var(--mute);margin:0 0 14px}
textarea{width:100%;min-height:340px;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:14px;
  font:14px/1.7 "IBM Plex Sans KR",sans-serif;resize:vertical}
.edb{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
.solid{background:var(--ink);color:var(--bg);border:0;padding:9px 18px;font-weight:500;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.err{color:var(--accent);font-size:13px;min-height:1.2em;margin-top:8px}

@media (max-width:720px){
  header{flex-direction:row;align-items:center}
  .arena{grid-template-columns:1fr}
  .pick{min-height:0;padding:28px 24px 26px !important}
  .pick.l{clip-path:polygon(0 0,100% 0,100% calc(100% - 26px),0 100%)}
  .pick.r{clip-path:polygon(0 26px,100% 0,100% 100%,0 100%);margin-left:0;margin-top:-26px;padding-top:50px !important}
  .pick.l{padding-bottom:50px !important}
  .thorn{width:72px;height:72px}
  .crown{padding:40px 26px 34px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="bgart" id="bgart" aria-hidden="true"></div>
<div class="wrap">
  <header style="justify-content:flex-end;align-items:center">
    <div class="hbtns">
      <button class="ghost" id="editBtn">곡 목록 편집</button>
      <button class="ghost" id="homeBtn">처음부터 다시</button>
    </div>
  </header>
  <main id="app"></main>
</div>
<dialog id="dlg">
  <div class="ed">
    <h3>곡 목록 편집</h3>
    <p>한 줄에 한 곡씩, <b>곡명 | 앨범 | 설명 | 나만의 한 줄</b> 순서로 적어주세요. 네 번째 칸에는 좋아하는 구절이나 그 곡에 얽힌 기억을 직접 적어두면 대결 화면에 크게 떠요. 줄을 바꾸고 싶은 자리에는 <b>/</b> 를 넣으세요. 저장하면 새 목록으로 처음부터 다시 시작해요.</p>
    <textarea id="ta" spellcheck="false"></textarea>
    <div class="err" id="err"></div>
    <div class="edb">
      <span style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="ghost" id="resetList">기본 목록으로 되돌리기</button>
      <button class="ghost" id="copyList">목록 전체 복사</button>
      <button class="ghost" id="exportBtn">내 목록으로 HTML 저장</button>
      </span>
      <span style="display:flex;gap:8px">
        <button class="ghost" id="cancelEd">닫기</button>
        <button class="solid" id="saveEd">저장하기</button>
      </span>
    </div>
  </div>
</dialog>
<script>
const __SCRIPT=(document.currentScript&&document.currentScript.textContent)||"";

function load(){

  return DEFAULT.map(s=>s.slice());
}

const roundName=n=> n===2?"결승":n===4?"준결승":`${n}강`;

function begin(){
  document.body.classList.remove("on-intro");
  const all=shuffle(songs.map((s,i)=>i));
  const n=all.length;
  let target=1; while(target*2<=n) target*=2;
  let pool=all, byes=[], prelim=false;
  if(target<n){ const m=n-target; pool=all.slice(0,m*2); byes=all.slice(m*2); prelim=true; }
  state={pool,next:byes,idx:0,cur:n,prelim,target,history:[],elim:{},total:n-1,done:0,n};
  renderMatch();
}

let busy=false;
function choose(win){
  if(busy) return; busy=true;
  const s=state;
  const a=s.pool[s.idx], b=s.pool[s.idx+1];
  const lose= win===a?b:a;
  app.querySelectorAll(".pick").forEach(p=>p.classList.add(+p.dataset.i===win?"won":"lost"));
  s.history.push(JSON.stringify({pool:s.pool,next:s.next,idx:s.idx,elim:s.elim,done:s.done,prelim:s.prelim}));
  s.next=s.next.concat(win);
  s.elim={...s.elim,[lose]:{round:s.prelim?0:s.pool.length,label:label(s),by:win}};
  s.idx+=2; s.done++;
  setTimeout(()=>{
    busy=false;
    if(s.idx>=s.pool.length){
      if(s.next.length===1){ renderResult(s.next[0]); return; }
      s.pool=shuffle(s.next); s.next=[]; s.idx=0; s.prelim=false;
    }
    renderMatch();
  },reduce()?0:420);
}
function undo(){
  const s=state; if(!s.history.length) return;
  Object.assign(s,JSON.parse(s.history.pop()));
  renderMatch();
}

      rows.push([p[0]||"",p[1]||"",p[2]||"",p.slice(3).join(" | ")||""]);
      rows.lastHit=null;

    const m=l.match(/^([^:：]{1,40})\s*[:：]\s*(.*)$/);
    if(m){

    const x=cx+RX*Math.cos(a), y=cy+RY*Math.sin(a);
    const nx=Math.cos(a)/RX, ny=Math.sin(a)/RY, nl=Math.hypot(nx,ny);
    const ux=nx/nl, uy=ny/nl, len=20+r()*26, w=3+r()*2.5;
    s+=`<path d="M${(x-uy*w).toFixed(1)} ${(y+ux*w).toFixed(1)} L${(x+ux*len).toFixed(1)} ${(y+uy*len).toFixed(1)} L${(x+uy*w).toFixed(1)} ${(y-ux*w).toFixed(1)}" fill="none" stroke="#eef3f2" stroke-width="1.4" stroke-linejoin="round"/>`;
  }
  // spines seen face-on across the surface
  for(let k=0;k<70;k++){
    const t=r()*Math.PI*2, d=Math.sqrt(r())*0.86;
    const x=cx+RX*d*Math.cos(t), y=cy+RY*d*Math.sin(t);
    if(y>cy+RY*0.72) continue;
    const ang=Math.atan2((y-cy)/RY,(x-cx)/RX), len=6+d*12;
    s+=`<path d="M${(x-2).toFixed(1)} ${y.toFixed(1)} L${(x+Math.cos(ang)*len).toFixed(1)} ${(y+Math.sin(ang)*len).toFixed(1)} L${(x+2).toFixed(1)} ${y.toFixed(1)}" fill="none" stroke="#eef3f2" stroke-width="1"/>`;
  }
  // seam lines of the capsule
  s+=`<path d="M${cx} ${cy-RY} C${cx-40} ${cy-40} ${cx-40} ${cy+60} ${cx} ${cy+RY}" fill="none" stroke="#eef3f2" stroke-width="1" opacity=".6"/>`;
  s+=`<path d="M${cx} ${cy-RY} C${cx+55} ${cy-30} ${cx+50} ${cy+70} ${cx} ${cy+RY}" fill="none" stroke="#eef3f2" stroke-width="1" opacity=".6"/>`;
  // the capsule itself
  s=`<ellipse cx="${cx}" cy="${cy}" rx="${RX}" ry="${RY}" fill="none" stroke="#eef3f2" stroke-width="1.8"/>`+s;
  // reflexed calyx collar and stalk
  let col="M118 "+(cy+RY-14);
  for(let i=0;i<9;i++){const x0=118+i*18.2; col+=` L${(x0+9).toFixed(1)} ${(cy+RY+18+r()*10).toFixed(1)} L${(x0+18.2).toFixed(1)} ${(cy+RY-14+ (i%2?4:0)).toFixed(1)}`;}
  s+=`<path d="${col}" fill="none" stroke="#b23a47" stroke-width="1.6" stroke-linejoin="round"/>`;
  s+=`<path d="M${cx} ${cy+RY+12} Q${cx+6} ${cy+RY+48} ${cx-10} ${cy+RY+72}" fill="none" stroke="#eef3f2" stroke-width="2.2" stroke-linecap="round"/>`;
  POD=`<svg viewBox="0 0 400 440" preserveAspectRatio="xMidYMid meet">${s}</svg>`;
  document.getElementById("bgart").innerHTML=POD;
})();
renderIntro();
(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    const ref=db.collection("data/users/"+id).doc("songs");
    const snap=await ref.get();
    dbDoc=ref;
    if(edited){ save(); return; }
    if(snap.exists){
      const a=JSON.parse(snap.data().json||"[]");
      if(Array.isArray(a)&&a.length>=2){ songs=a.filter(r=>r[0]!=="행복한 나를"); if(songs.length!==a.length) save(); try{localStorage.setItem(KEY,JSON.stringify(songs));}catch(e){} if(!state) renderIntro(); else if(state.done===0) begin(); }
    }else{
      let had=false; try{had=!!localStorage.getItem(KEY);}catch(e){}
      if(had) save();
    }
  }catch(e){ console.warn("db unavailable",e); }
})();
